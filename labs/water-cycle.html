<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>The water cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8f1f7; --ink:#0a2540; --muted:#48627a; --line:#c2d4e2;
  --chip:#ffffff; --panel:#ffffff; --accent:#0b5c9e; --accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
    --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
  }
}
:root[data-theme="dark"]{
  --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
  --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Bricolage Grotesque','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{
  max-width:1120px;margin:0 auto;padding:16px 14px 28px;
  display:grid;gap:14px;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"top" "views" "modes" "stage" "panel";
}
.top{grid-area:top;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:52ch}
.lang{
  flex:none;min-height:40px;min-width:56px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:14px
}

.modes{grid-area:modes;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modes button{
  flex:1 1 auto;min-height:42px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:14px;
  transition:background .2s,color .2s
}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stage{
  grid-area:stage;border-radius:22px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#14417a 0%,#0a2447 52%,#040d1a 100%);
  border:1px solid rgba(143,214,247,.18);
}
.stage svg{display:block;width:100%;height:auto}

.panel{
  grid-area:panel;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:16px;align-self:start
}
.steps{display:flex;gap:6px;margin:0 0 10px}
.seg{flex:1;height:24px;border:0;background:transparent;padding:0;position:relative}
.seg::after{
  content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;
  background:var(--line);transition:background .3s
}
.seg.done::after{background:var(--accent);opacity:.5}
.seg.now::after{background:var(--accent)}
.count{margin:0;color:var(--muted);font-size:13px}
h2{margin:2px 0 6px;font-size:23px;line-height:1.2;font-weight:700}
.desc{margin:0 0 16px;font-size:15.5px;max-width:58ch;min-height:3em}
.controls{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"next next" "back play";gap:8px}
.controls #next{grid-area:next}.controls #back{grid-area:back}.controls #play{grid-area:play}
.controls button{
  min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--chip);font-weight:700;font-size:15px
}
.controls .next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls button[disabled]{opacity:.4;cursor:default}

@media (min-width:900px){
  .app{
    padding:28px 24px 40px;gap:18px 26px;
    grid-template-columns:minmax(0,1.7fr) minmax(320px,.9fr);
    grid-template-rows:auto auto auto 1fr;
    grid-template-areas:"top top" "stage views" "stage modes" "stage panel";
  }
  h1{font-size:34px}
  .modes,.views{align-self:start}
  .stage{align-self:start;position:sticky;top:20px}
}

[hidden]{display:none!important}
.cmp{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.cmp button{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:13px}
.baseCap{font-size:12.5px;color:var(--muted);margin:0 0 4px}
.bar.thin{height:8px;margin:0 0 8px;opacity:.7}
.notes{margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
.notes summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center}
.notes p{margin:8px 0 0;font-size:13.5px;color:var(--muted);max-width:62ch}
.notes b{color:var(--ink)}
.views{
  grid-area:views;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;
  border:1px solid var(--line);border-radius:999px;background:var(--chip)
}
.views button{min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14.5px}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.presets button{
  min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);font-weight:600;font-size:13.5px
}
.presets button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{margin:0 0 12px}
.row label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14.5px}
.row output{font-variant-numeric:tabular-nums;color:var(--accent)}
.row input[type=range]{display:block;width:100%;height:30px;margin:2px 0 0;accent-color:var(--accent);background:transparent}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
#pHead{margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);font-size:20px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:0 0 12px;background:var(--line)}
.bar span{display:block;height:100%;transition:width .35s ease}
.legend{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px;font-size:14px}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px}
.legend b{font-variant-numeric:tabular-nums;font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--chip)}
.card small{display:block;color:var(--muted);font-size:12.5px}
.card strong{display:block;font-size:18px;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.insight{margin:0 0 8px;font-size:15.5px}
.fine{margin:0;color:var(--muted);font-size:12.5px}
#scene.play .layer{transition:opacity .35s ease}
#scene.play .cloudL{transition:opacity .4s ease,transform .5s ease}
@media (max-width:899px){
  .app.playing{display:flex;flex-direction:column}
  .app.playing .views{order:1}
  .app.playing .stage{
    order:2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;
    box-shadow:0 10px 26px rgba(0,0,0,.35)
  }
  .app.playing .panel{order:3}
}
/* ---------- scene ---------- */
.layer{opacity:0;transition:opacity .6s ease}
.layer.on{opacity:var(--i,1)}
.layer.dim{opacity:.22}
.layer:not(.on) *{animation-play-state:paused}
#evapSea,#evapLand{filter:drop-shadow(0 0 8px rgba(150,220,255,.6))}
.cloudL{
  transform-box:fill-box;transform-origin:50% 85%;transform:scale(.6);
  transition:opacity 1s ease,transform 1.4s cubic-bezier(.2,.8,.2,1)
}
.cloudL.on,.cloudL.dim{transform:scale(var(--cs,1))}
.cloudL .wetimg{opacity:0;transition:opacity 1.3s ease}
.cloudL.wet .wetimg{opacity:1}
.fx{animation-fill-mode:backwards}
.rise{animation:rise var(--rd,3.6s) ease-out infinite backwards}
.fall{animation:fall .95s linear infinite backwards}
.dR{stroke-dasharray:2 26;animation:dashR var(--rs,1.3s) linear infinite}
.dA{stroke-dasharray:10 40;animation:dashA var(--as,2.4s) linear infinite}
.dS{stroke-dasharray:8 30;animation:dashS var(--ss,1.1s) linear infinite}
.dW{stroke-dasharray:26 18;animation:dashW 1.6s linear infinite}
.spark{animation:twinkle 3.6s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}18%{opacity:.95}100%{transform:translateY(-100px);opacity:0}}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(var(--d,100px));opacity:0}}
@keyframes dashR{to{stroke-dashoffset:-28}}
@keyframes dashA{to{stroke-dashoffset:-50}}
@keyframes dashS{to{stroke-dashoffset:-38}}
@keyframes dashW{to{stroke-dashoffset:-44}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.5}}
#wind.dim{opacity:.1}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.beam{opacity:0;transition:opacity .9s}
#scene.hot .beam{opacity:1}
.sunglow{transform-box:fill-box;transform-origin:center}
#scene.hot .sunglow{animation:glow 2.8s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .fx,.dR,.dA,.dS,.dW,.spark,#scene.hot .sunglow{animation:none!important}
  .layer,.cloudL,.beam,.wetimg{transition-duration:.01s}
}
</style>
</head>
<body>

  <header class="top">
    <div>
      <h1 id="h1">The water cycle</h1>

  </header>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };

  /* ---------- copy ---------- */
  var UI = {
    en:{ h1:'The water cycle', back:'Back', play:'Auto-play', pause:'Pause', again:'Start over',

    zh:{ h1:'水循环的过程及类型', back:'上一步', play:'自动播放', pause:'暂停', again:'重新开始',
         next:function(t){return '下一步：'+t;}, count:function(i,n){return '第 '+i+' 步，共 '+n+' 步';}, lang:'EN', mode:'循环类型' }
  };
  var CAT = {
    evapSea:{en:['Evaporation','The sun warms the ocean. Surface water turns to vapor and rises.'],zh:['蒸发','太阳加热海洋，海面的水变成水汽上升。']},
    evapAll:{en:['Evaporation','The sun warms oceans, lakes, soil and plants. Water rises as vapor from sea and land.'],zh:['蒸发','太阳加热海洋、湖泊、土壤和植物，水汽从海面和陆地一起升起。']},
    evapLand:{en:['Evaporation and transpiration','Lakes and wet soil release vapor, and plants give off water through their leaves.'],zh:['蒸发与蒸腾','湖泊和湿润的土壤释放水汽，植物也通过叶片散发水分。']},
    wind:{en:['Vapor transport','Winds carry moist air from the ocean over the land.'],zh:['水汽输送','气流把海洋上空的湿润空气带向陆地。']},
    cond:{en:['Condensation','Rising air cools. Vapor condenses into tiny droplets and forms clouds.'],zh:['凝结成云','上升的空气变冷，水汽凝结成小水滴，形成云。']},
    precSea:{en:['Precipitation','Droplets merge, grow heavy and fall as rain, straight back into the ocean.'],zh:['降水','水滴合并变重，以雨的形式直接落回海洋。']},
    precLand:{en:['Precipitation','Droplets merge, grow heavy and fall onto the land as rain or snow.'],zh:['降水','水滴合并变重，以雨或雪的形式落到陆地上。']},
    precAll:{en:['Precipitation','Rain falls on the ocean and on the land. Snow settles on the peaks.'],zh:['降水','雨落在海洋和陆地上，雪覆盖山顶。']},
    runSea:{en:['Surface runoff','Rain and snowmelt run downhill through rivers and lakes, and return to the ocean.'],zh:['地表径流','雨水和融雪顺着地势流过河流与湖泊，最终回到海洋。']},
    runLake:{en:['Surface runoff','Rain and snowmelt run downhill into the lake. The water stays on land.'],zh:['地表径流','雨水和融雪顺着山坡流入湖泊，水仍留在陆地上。']},
    infil:{en:['Infiltration and groundwater','Some water soaks into the soil and creeps underground toward the sea.'],zh:['下渗与地下径流','一部分水渗入土壤，沿地下缓慢流向海洋。']}
  };
  var MODES = [
    { id:'whole', en:'Whole cycle', zh:'整体水循环',

      steps:[['evapAll',['evapSea','evapLand']],['wind',['wind']],['cond',['cloudSea','cloudLand']],

    { id:'sealand', en:'Sea–land', zh:'海陆间循环',
      sub:{en:'Ocean to air, air to land, land back to the ocean.',zh:'海洋到大气，大气到陆地，再由陆地回到海洋。'},
      steps:[['evapSea',['evapSea']],['wind',['wind']],['cond',['cloudLand']],['precLand',['cloudLand','rainLand']],

    { id:'inland', en:'Inland', zh:'陆地内循环',

    { id:'ocean', en:'Ocean', zh:'海上内循环',
      sub:{en:'Water that leaves the sea and falls straight back into it.',zh:'水从海面升起，又直接落回海面。'},
      steps:[['evapSea',['evapSea']],['cond',['cloudSea']],['precSea',['cloudSea','rainSea']]] }
  ];
  var LAYERS = ['evapSea','evapLand','wind','runUp','runDown','infil','aquifer','rainSea','rainLand','cloudSea','cloudLand'];

  /* ---------- scene building ---------- */
  var seed = 11;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var ARROW = 'M-5,0 L-5,-38 L-14,-38 L0,-60 L14,-38 L5,-38 L5,0 Z';

  function smooth(pts){
    var d = 'M'+pts[0][0]+' '+pts[0][1];
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      d += ' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)
         + ' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)
         + ' '+p2[0]+' '+p2[1];
    }
    return d;
  }
  var DEF = {r:[28,8], s:[20,6], a:[44,10]};
  function flow(d, cls, p, glowC, coreC){
    var gcol = p === 'r' ? 'var(--rcol,'+glowC+')' : glowC;
    return '<path d="'+d+'" fill="none" stroke-opacity=".5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" style="stroke:'+gcol+';stroke-width:calc(var(--'+p+'g,'+DEF[p][0]+') * 1px)"/>'
         + '<path class="'+cls+'" d="'+d+'" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:'+coreC+';stroke-width:calc(var(--'+p+'w,'+DEF[p][1]+') * 1px)"/>';
  }

  // ocean sparkle
  (function(){
    var OC = [[40,402],[395,342],[462,336],[520,364],[545,420],[610,470],[690,515],[640,560],[330,598]];
    function inside(x,y){
      var c = false;
      for(var i=0,j=OC.length-1;i<OC.length;j=i++){
        var xi=OC[i][0], yi=OC[i][1], xj=OC[j][0], yj=OC[j][1];
        if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c = !c;
      }
      return c;
    }
    var out = '', n = 0, guard = 0;
    while(n < 44 && guard < 4000){
      guard++;
      var x = 60 + rnd()*500, y = 340 + rnd()*250;
      var front = x < 326 ? 397 + (x-22)*0.6875 : 606 - (x-326)*0.097;
      if(!inside(x,y) || y > front - 24) continue;
      out += '<path class="spark" style="animation-delay:'+(rnd()*3.6).toFixed(2)+'s" d="M'+x.toFixed(0)+' '+y.toFixed(0)+' q6 -3 12 0"/>';
      n++;
    }
    $('#sparks').innerHTML = out;
  })();

  // vapor arrows
  function arrows(list, delayStep){
    return list.map(function(p,i){
      return '<g transform="translate('+p[0]+' '+p[1]+') scale('+p[2]+')"><path class="fx rise" style="animation-delay:'+(i*delayStep).toFixed(2)+'s" d="'+ARROW+'" fill="url(#vap)"/></g>';
    }).join('');
  }
  $('#evapSea').innerHTML = arrows([[170,470,1.5],[255,505,1.6],[305,430,1.4],[365,525,1.7],[425,455,1.5],[490,505,1.5]], .55);
  $('#evapLand').innerHTML = arrows([[1040,338,1.3],[1110,330,1.3],[1170,325,1.2],[690,338,1.2],[765,378,1.3],[845,350,1.1],[1160,402,1.2],[1245,382,1.1]], .5);

  // rivers, groundwater, seepage
  var MAIN = [[1012,338],[995,355],[980,375],[970,386],[925,391],[896,396],[886,406],[905,412],[935,422],[980,436],[996,446],[975,455],[920,450],[870,445],[825,461],[790,480],[760,500],[735,512]];
  var UP = [[1248,170],[1252,210],[1258,250],[1260,270],[1255,290],[1232,304],[1205,310],[1178,314]];
  $('#runUp').innerHTML = flow(smooth(UP), 'dR', 'r', '#8fe6ff', '#ffffff');
  $('#runDown').innerHTML = flow(smooth(MAIN), 'dR', 'r', '#8fe6ff', '#ffffff');

  var SEEP = ['M1010 452 C1050 454 1080 462 1092 486 L1096 570 L1098 672',
              'M1367 368 L1371 430 L1373 490', 'M1433 410 L1435 490', 'M853 556 L855 610 L856 668'];
  $('#infil').innerHTML = SEEP.map(function(d){ return flow(d, 'dS', 's', '#8fe6ff', '#ffffff'); }).join('');

  var AQ = [[1495,455],[1450,470],[1380,500],[1300,530],[1230,550],[1170,570],[1100,590],[1020,605],[950,615],[890,635],[840,655],[800,675],[750,695],[700,710],[670,720]];
  $('#aquifer').innerHTML = flow(smooth(AQ), 'dA', 'a', '#7fdcff', '#eaffff');

  // rain
  function rain(x0,x1,y0,y1,n,dmin,dmax){

  // Saturation humidity (Magnus formula), used for sea evaporation.
  function qsat(T){ var e = 6.112*Math.exp(17.62*T/(243.12+T)); return 0.622*e/(1013.25-0.378*e); }
  // Ocean evaporation from the bulk aerodynamic formula: E = rho * C_E * U * (q_sat(SST) - RH * q_sat(air)).
  // Assumes wind 7 m/s, relative humidity 80%, air 1 C cooler than the sea, sea temperature = the temperature slider.
  function seaEvap(T){
    var dq = Math.max(0, qsat(T) - 0.8*qsat(T-1));
    return 1.2*1.3e-3*7*dq*365*86400;   // mm/yr
  }
  var TO_CMS = 200*1e6/1000/(365*86400);  // 1 mm/yr over 200 km2 -> m3/s

  // Simple yearly water balance for a 200 km2 catchment: P = ET + runoff + recharge.
  function calc(s){
    var P = s.P, T = s.T, F = s.F/100, k = s.K/100;
    var L = 300 + 25*T + 0.05*T*T*T;                                   // Turc (1954)
    var et0 = (P/L <= 0.316) ? P : P / Math.sqrt(0.9 + (P/L)*(P/L));
    var adj = (0.88 + 0.24*F) * (0.5 + 0.5*Math.sqrt(k));                   // teaching adjustment for forest and paving
    var wAr = clamp((P/L - 0.316)/(0.8 - 0.316), 0, 1);                       // fades out in dry climates, where all rain evaporates anyway
    var ET = Math.min(et0 * (1 + (adj - 1)*wAr), P);
    var tr = ET * (0.15 + 0.55*F), ev = ET - tr;
    var surplus = P - ET;
    var fi = clamp(0.10 + 0.65*k + 0.15*F, 0.05, 0.9);
    var rch = surplus * fi, ro = surplus - rch;
    return {P:P, T:T, ET:ET, tr:tr, ev:ev, surplus:surplus, fi:fi, rch:rch, ro:ro,
            Q:ro*TO_CMS, Qg:rch*TO_CMS, sea:seaEvap(T), ratio:ro/P, F:s.F, K:s.K};
  }

  $('#cmpSave').addEventListener('click', function(){ BASE = {s:{T:S.T,P:S.P,F:S.F,K:S.K}, m:calc(S)}; renderPlay(); });
  $('#cmpClear').addEventListener('click', function(){ BASE = null; renderPlay(); });
  window.__wc = {calc:calc, seaEvap:seaEvap, TO_CMS:TO_CMS};
  $('#views').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) setView(b.dataset.v);
  });
  $('#presets').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var v = PR[b.dataset.p];
    Object.keys(v).forEach(function(k){ S[k] = v[k]; $('#s-'+k).value = v[k]; });
    renderPlay();
  });
  $('#sliders').addEventListener('input', function(e){
    var t = e.target; if(t.type !== 'range') return;
    S[t.id.slice(2)] = +t.value; renderPlay();
  });

  render();
})();
</script>
</body>
</html>
