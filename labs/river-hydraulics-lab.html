<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>River hydraulics lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8f1f7; --ink:#0a2540; --muted:#48627a; --line:#c2d4e2;
  --chip:#ffffff; --panel:#ffffff; --accent:#0b5c9e; --accent-ink:#ffffff;
  --warn:#b45309; --bad:#b42318; --good:#15803d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
    --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
    --warn:#f5b453; --bad:#ff8a80; --good:#6ee7a0;
  }
}
:root[data-theme="dark"]{
  --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
  --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
  --warn:#f5b453; --bad:#ff8a80; --good:#6ee7a0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Bricolage Grotesque','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding:16px 14px 30px;display:flex;flex-direction:column;gap:12px}
.left,.right{display:contents}
.top{order:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tabs{order:1}.stage{order:2}.p1{order:3}.p2{order:4}.p3{order:5}.p4{order:6}.credit{order:9}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:58ch}
.lang{flex:none;min-height:40px;min-width:56px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--chip)}
.tabs button{min-height:42px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14.5px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;border-radius:22px;overflow:hidden;
  background:#0c1f33;border:1px solid rgba(143,214,247,.2);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.stage svg{display:block;width:100%;height:auto}
@media (max-height:560px){.stage{position:relative;top:auto}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.panel h2{margin:0 0 8px;font-size:18px}
.panel h3{margin:14px 0 6px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.small button{min-height:32px;padding:0 10px;font-size:12.5px;font-weight:500}
.chips.small button b{font-weight:700;margin-left:4px;color:var(--muted)}
.row{margin:0 0 8px}
.row label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}
.row output{font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{display:block;width:100%;height:30px;margin:2px 0 0;accent-color:var(--accent);background:transparent}
.grp{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.grp>small{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:var(--chip);min-width:0}
.card small{display:block;color:var(--muted);font-size:12px}
.card strong{display:block;font-size:18px;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card em{display:block;font-style:normal;color:var(--muted);font-size:11.5px}
.card.ok strong{color:var(--good)}.card.warn strong{color:var(--warn)}.card.bad strong{color:var(--bad)}
.msgs{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.msgs li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px}
.msgs li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.msgs li.warn::before{background:var(--warn)}.msgs li.bad::before{background:var(--bad)}.msgs li.ok::before{background:var(--good)}
.chart{display:block;width:100%;height:auto;color:var(--muted);margin:0 0 6px}
.chart text{font-family:inherit;font-size:10px;fill:currentColor}
.fine{margin:10px 0 0;color:var(--muted);font-size:12.5px}
.notes{margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
.notes summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center}
.notes p{margin:8px 0 0;font-size:13.5px;color:var(--muted);max-width:64ch}
.notes b{color:var(--ink)}
.credit{margin:0;text-align:center;color:var(--muted);font-size:12px}

#view .flow{animation:flowdash 1.4s linear infinite}
#view .wave{animation:wave 3.4s ease-in-out infinite alternate}
#view .foamdot{animation:foam 1.1s ease-in-out infinite alternate}
#view .drift{animation:drift 3.6s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-32}}
@keyframes wave{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
@keyframes foam{from{opacity:.35}to{opacity:.95}}
@keyframes drift{0%{transform:translateX(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(70px);opacity:0}}
@media (prefers-reduced-motion:reduce){#view .flow,#view .wave,#view .foamdot,#view .drift{animation:none}}

@media (min-width:900px){
  .app{padding:28px 24px 40px;gap:14px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,.9fr);align-items:start}
  .top{grid-column:1 / -1}
  .left{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .right{display:flex;flex-direction:column;gap:12px}
  .stage{position:relative;top:auto}
  h1{font-size:34px}
}

.chips.small button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.chips.small button[aria-pressed="true"] b{color:inherit;opacity:.8}

</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
    <button class="lang" id="lang" type="button" aria-label="Switch language">中文</button>
  </header>

  <div class="left">
    <section class="stage" id="stage"><div id="view" role="img"></div></section>
    
  </div>

  <div class="right">
    <nav class="tabs" id="tabs"></nav>

    <section class="panel p1" id="chCtl">
      <div class="chips" id="shapes"></div>
      <div id="chSliders"></div>
      <div class="grp"><small id="nHelp"></small><div class="chips small" id="nPre"></div></div>
      <div class="grp"><div class="chips" id="modes"></div><div id="chSliders2"></div></div>
    </section>
    <section class="panel p2" id="chRes">
      <h2 id="chResH"></h2>
      <div class="cards" id="chCards"></div>
      <ul class="msgs" id="chMsgs"></ul>
      <h3 id="eyH"></h3><svg class="chart" id="eyChart" viewBox="0 0 320 170"></svg>
      <h3 id="rtH"></h3><svg class="chart" id="rtChart" viewBox="0 0 320 170"></svg>
      <details class="notes"><summary id="chNSum"></summary><div id="chNBody"></div></details>
    </section>

    <section class="panel p1" id="stCtl" hidden>
      <div class="chips" id="stTypes"></div>
      <div id="stSliders"></div>
      <div class="grp"><small id="matHelp2"></small><div class="chips small" id="stMat"></div></div>
      <div class="grp"><small id="tcHead"></small><div class="chips small" id="tcMode"></div><div id="stSliders2"></div></div>
    </section>
    <section class="panel p2" id="stRes" hidden>
      <h2 id="stResH"></h2>
      <div class="cards" id="stCards"></div>
      <ul class="msgs" id="stMsgs"></ul>
      <h3 id="hqH"></h3><svg class="chart" id="hqChart" viewBox="0 0 320 170"></svg>
      <details class="notes"><summary id="stNSum"></summary><div id="stNBody"></div></details>
    </section>
    <p class="credit" id="credit"></p>
  </div>
</main>

<script>
(function(){
"use strict";
/* ================= hydraulics core (SI units) ================= */
var g = 9.81, RHO = 1000, RHOS = 2650, THETA_C = 0.047;
function clamp(x,a,b){ return x < a ? a : (x > b ? b : x); }
function bisect(f, lo, hi, it){
  var flo = f(lo);
  for(var i=0;i<(it||80);i++){
    var mid = 0.5*(lo+hi), fm = f(mid);
    if((fm < 0) === (flo < 0)){ lo = mid; flo = fm; } else hi = mid;
  }
  return 0.5*(lo+hi);
}

/* cross-section geometry: shape in rect | trap | tri | circ */
function geom(shape,p,y){
  var A, P, T;
  if(shape === 'rect'){ A = p.b*y; P = p.b + 2*y; T = p.b; }
  else if(shape === 'trap'){ var s = Math.sqrt(1+p.z*p.z); A = (p.b + p.z*y)*y; P = p.b + 2*y*s; T = p.b + 2*p.z*y; }
  else if(shape === 'tri'){ var s2 = Math.sqrt(1+p.z*p.z); A = p.z*y*y; P = 2*y*s2; T = 2*p.z*y; }
  else {
    var D = p.D;
    if(y >= D){ A = Math.PI*D*D/4; P = Math.PI*D; T = 0; }
    else { var th = 2*Math.acos(1-2*y/D); A = D*D/8*(th-Math.sin(th)); P = D*th/2; T = D*Math.sin(th/2); }
  }
  return {A:A, P:P, T:T, R:P > 0 ? A/P : 0};
}
function manningQ(shape,p,y,n,S){ var G = geom(shape,p,y); return G.A*Math.pow(G.R,2/3)*Math.sqrt(S)/n; }

function normalDepth(shape,p,Q,n,S,ymax){
  var f = function(y){ return manningQ(shape,p,y,n,S) - Q; };
  if(shape === 'circ'){
    var ypk = 0.938*p.D, Qpk = manningQ(shape,p,ypk,n,S);
    if(Q > Qpk) return {y:p.D, full:true, Qmax:Qpk};
    return {y:bisect(f,1e-6,ypk), full:false, Qmax:Qpk};
  }
  var hi = Math.max(1, ymax || 1);
  while(f(hi) < 0 && hi < 1e5) hi *= 2;
  return {y:bisect(f,1e-6,hi), full:false};
}
function criticalDepth(shape,p,Q){
  var f = function(y){ var G = geom(shape,p,y); return G.A*G.A*G.A/G.T - Q*Q/g; };
  if(shape === 'circ'){
    var top = p.D*0.9999; if(f(top) < 0) return null;
    return bisect(f,1e-6,top);
  }
  var hi = 1; while(f(hi) < 0 && hi < 1e5) hi *= 2;
  return bisect(f,1e-6,hi);
}
function froude(shape,p,y,V){ var G = geom(shape,p,y); if(!(G.T > 0)) return NaN; return V/Math.sqrt(g*G.A/G.T); }

function calcChannel(s){
  var p = {b:s.b, z:s.z, D:s.D}, S0 = s.S0/1000, n = s.n;
  var ymax = s.shape === 'circ' ? s.D : s.bank, o = {}, y, Q, full = false;
  if(s.mode === 'depth'){
    y = Math.min(s.y, ymax); Q = manningQ(s.shape,p,y,n,S0);
    if(s.shape === 'circ' && y >= s.D) full = true;
  } else {
    Q = s.Qset; var nd = normalDepth(s.shape,p,Q,n,S0,ymax); y = nd.y; full = nd.full; o.Qmax = nd.Qmax;
  }
  var G = geom(s.shape,p,y), V = Q/G.A;
  var yc = criticalDepth(s.shape,p,Q);
  var Fr = full ? NaN : froude(s.shape,p,y,V);
  var tau0 = RHO*g*G.R*S0, tauC = THETA_C*(RHOS-RHO)*g*(s.d50/1000);
  var E = y + V*V/(2*g);
  var Sc = null;
  if(yc !== null){ var Gc = geom(s.shape,p,yc), Vc = Q/Gc.A; Sc = Math.pow(n*Vc/Math.pow(Gc.R,2/3),2); }
  var Qfull = s.shape === 'circ' ? manningQ('circ',p,s.D,n,S0) : null;
  o.y = y; o.Q = Q; o.A = G.A; o.P = G.P; o.R = G.R; o.T = G.T; o.V = V; o.Fr = Fr; o.yc = yc; o.E = E;
  o.tau0 = tau0; o.tauC = tauC; o.Sc = Sc; o.S0 = S0; o.full = full; o.ymax = ymax; o.Qfull = Qfull;
  o.freeboard = s.shape === 'circ' ? s.D - y : s.bank - y; o.over = s.shape !== 'circ' && y > s.bank + 1e-9;
  o.exceeds = (s.mode === 'flow' && s.shape === 'circ' && full);
  return o;
}

/* ---------- rectangular-channel helpers used by structures ---------- */
function rectNormal(Q,B,n,S){ return normalDepth('rect',{b:B},Q,n,S,5).y; }
function specE(y,q){ return y + q*q/(2*g*y*y); }
function subDepth(E,q){ var yc = Math.cbrt(q*q/g); return bisect(function(y){ return specE(y,q)-E; }, yc, Math.max(E,yc*1.0001), 90); }
function superDepth(E,q){ var yc = Math.cbrt(q*q/g); return bisect(function(y){ return E - specE(y,q); }, 1e-7, yc, 90); }
function conjugate(y,q){ var Fr = q/y/Math.sqrt(g*y); return 0.5*y*(Math.sqrt(1+8*Fr*Fr)-1); }
function jumpInfo(yt,q,ytw){
  var Fr = q/yt/Math.sqrt(g*yt), y2 = conjugate(yt,q), ratio = ytw/y2;
  var type = Fr < 1.7 ? 'undular' : (Fr < 2.5 ? 'weak' : (Fr < 4.5 ? 'osc' : (Fr <= 9 ? 'steady' : 'strong')));
  var state = ratio < 0.97 ? 'swept' : (ratio > 1.10 ? 'drowned' : 'toe');
  var loss = Math.pow(y2-yt,3)/(4*yt*y2);
  return {Fr:Fr, y2:y2, ratio:ratio, type:type, state:state, loss:loss, Lj:6*y2};
}

/* gradually varied flow, M1 backwater upstream of a structure (rectangular channel) */
function backwater(B,n,S0,Q,y1,yn){
  var q = Q/B, pts = [{d:0,y:y1}], y = y1, d = 0, target = yn + 0.02*(y1-yn);
  var f = function(yy){
    var A = B*yy, R = A/(B+2*yy), Sf = Math.pow(n*Q/(A*Math.pow(R,2/3)),2), Fr2 = q*q/(g*yy*yy*yy);
    return (S0-Sf)/(1-Fr2);
  };
  var guard = 0, done = true;
  while(y > target){
    var sl = f(y); if(!(sl > 0)) break;
    var h = Math.min(250,Math.max(0.05,0.03*(y-yn)/sl));
    var k1 = f(y), k2 = f(y-0.5*h*k1), k3 = f(y-0.5*h*k2), k4 = f(y-h*k3);
    y -= h*(k1+2*k2+2*k3+k4)/6; d += h; pts.push({d:d,y:y}); guard++;
    if(d > 100000 || guard > 3000){ done = false; break; }
  }
  return {pts:pts, L:d, complete:done};
}

/* ---------- structures ---------- */
var VILLEMONTE_N = {sharp:1.5, vnotch:2.5};
function headSolve(Qt, qfree, H2, m){
  var f = function(H){
    var Qf = qfree(H);
    if(H2 > 0){ var r = H2/H; if(r >= 1) return 0; Qf *= Math.pow(1-Math.pow(r,m),0.385); }
    return Qf;
  };
  var lo = Math.max(H2,0)*1.000001 + 1e-6, hi = lo + 1;
  while(f(hi) < Qt && hi < 1e4) hi *= 2;
  return bisect(function(H){ return f(H) - Qt; }, lo, hi, 90);
}
function calcStruct(s){
  var B = s.B, Q = s.Q, n = s.n, S0 = s.S0/1000, q = Q/B, type = s.st;
  var yn = rectNormal(Q,B,n,S0), yc = Math.cbrt(q*q/g), Frn = q/yn/Math.sqrt(g*yn);
  var ytw = s.twAuto ? yn : s.twMan;
  var r = {type:type, Q:Q, B:B, q:q, yn:yn, yc:yc, Frn:Frn, ytw:ytw, warn:[]};
  var P = s.P, H = 0, y1, E1, yt, twOverCrest = 0;
  if(type === 'gate'){
    var a = s.a, y2 = s.Cc*a, V2 = q/y2, Fr2 = V2/Math.sqrt(g*y2);
    r.a = a; r.yt = y2;
    if(Fr2 <= 1){ r.ctrl = false; y1 = yn; r.warn.push('gateFree'); }
    else {
      var V3 = q/ytw, y2c = 0.5*y2*(Math.sqrt(1+8*Fr2*Fr2)-1), ys2 = ytw*ytw + 2*q*(V3-V2)/g;
      // momentum balance between the vena contracta and the tailwater section: a drowned jump raises the pressure depth ys above y2
      var ys = ytw > y2c ? Math.sqrt(Math.max(ys2,y2*y2)) : y2;
      r.submerged = ys > y2*1.0001; r.ys = ys; r.ctrl = true;
      var E = ys + V2*V2/(2*g); y1 = subDepth(E,q);
      if(y1 <= a) { r.warn.push('gateOut'); }
      r.Cd = Q/(B*a*Math.sqrt(2*g*y1));
    }
    E1 = specE(y1,q); yt = y2;
  } else {
    var qfree, m = 1.5, L = s.L, Hh;
    if(type === 'sharp'){
      var nc = L < B - 1e-9 ? 2 : 0; r.contracted = nc > 0;
      qfree = function(H){ var Cd = 0.611 + 0.075*H/P, Le = Math.max(1e-6, L - 0.1*nc*H); return (2/3)*Cd*Math.sqrt(2*g)*Le*Math.pow(H,1.5); };
      twOverCrest = Math.max(0, ytw - P); Hh = headSolve(Q,qfree,twOverCrest,VILLEMONTE_N.sharp); r.L = L;
    } else if(type === 'vnotch'){
      var tn = Math.tan(s.theta*Math.PI/360);
      qfree = function(H){ return (8/15)*0.58*Math.sqrt(2*g)*tn*Math.pow(H,2.5); };
      twOverCrest = Math.max(0, ytw - P); Hh = headSolve(Q,qfree,twOverCrest,VILLEMONTE_N.vnotch);
      r.notchTop = 2*Hh*tn; if(r.notchTop > B) r.warn.push('notchWide');
    } else if(type === 'broad' || type === 'check'){
      var Cd = s.Cd; qfree = function(H){ return Cd*Math.pow(2/3,1.5)*Math.sqrt(g)*B*Math.pow(H,1.5); };
      Hh = headSolve(Q,qfree,0,1.5); twOverCrest = Math.max(0, ytw - P); r.HL = Hh/s.Lc;
      if(twOverCrest > 0.8*Hh) r.warn.push('drownedCrest');
    } else { // ogee
      var He = Math.pow(Q/(s.C*B),2/3); r.He = He;
      var yy = bisect(function(y){ return specE(y,q) - (P+He); }, Math.cbrt(q*q/g)*1.0000001, P+He, 90);
      Hh = yy - P; twOverCrest = Math.max(0, ytw - P); r.HdRatio = He/s.Hd;
      if(twOverCrest > 0) r.warn.push('drownedCrest');
    }
    H = Hh; y1 = P + H; r.H = H; r.P = P; r.twOverCrest = twOverCrest;
    r.sub = twOverCrest > 0 && (type === 'sharp' || type === 'vnotch');
    if(type === 'sharp' || type === 'vnotch'){ if(H < 0.06) r.warn.push('lowHead'); if(type === 'sharp' && H/P > 2) r.warn.push('highRatio'); }
    if(type === 'broad' || type === 'check'){ r.HL = H/s.Lc; if(r.HL < 0.08 || r.HL > 0.5) r.warn.push('broadRange'); }
    E1 = specE(y1,q); yt = superDepth(E1,q);
  }
  r.y1 = y1; r.E1 = E1; r.yt = yt;
  r.V1 = q/y1; r.Fr1 = r.V1/Math.sqrt(g*y1); r.afflux = y1 - yn;
  r.Etw = specE(ytw,q); r.Eloss = E1 - r.Etw; r.ElossPct = 100*r.Eloss/E1;
  if(r.ctrl !== false || type !== 'gate'){ r.jump = jumpInfo(yt,q,ytw); }
  r.steep = Frn >= 1;
  if(!s.noBw && !r.steep && r.afflux > 1e-4 && (type !== 'gate' || r.ctrl)){ r.bw = backwater(B,n,S0,Q,y1,yn); }

  if(type === 'check'){
    var k = s.k; r.spacing = P/(S0*(1-k)); r.wedge = 0.5*P*r.spacing*B;
  }
  return r;
}

  $('#tcMode').innerHTML = [['auto',t.tc.auto],['man',t.tc.man]].map(function(p){ return '<button type="button" data-tc="'+p[0]+'" aria-pressed="'+((p[0] === 'auto') === S.twAuto)+'">'+p[1]+'</button>'; }).join('');
  $('#tabs').innerHTML = t.tabs.map(function(x,i){ return '<button type="button" data-tab="'+i+'" aria-pressed="'+(i === S.tab)+'">'+x+'</button>'; }).join('');
  $('#h1').textContent = t.title; $('#sub').textContent = t.sub[S.tab]; document.title = t.title;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('#lang').textContent = lang === 'en' ? '中文' : 'EN';
  $('#chResH').textContent = t.chResH; $('#stResH').textContent = t.stResH;
  $('#eyH').textContent = t.eyH; $('#rtH').textContent = t.rtH; $('#hqH').textContent = t.hq;
  $('#chNSum').textContent = $('#stNSum').textContent = lang === 'zh' ? '这是怎么计算的' : 'How this is calculated';
  $('#chNBody').innerHTML = t.chN.map(function(x){ return '<p>'+x+'</p>'; }).join('');
  $('#stNBody').innerHTML = t.stN.map(function(x){ return '<p>'+x+'</p>'; }).join('');
  $('#credit').textContent = t.credit;
  ['chCtl','chRes'].forEach(function(id){ $('#'+id).hidden = S.tab !== 0; });
  ['stCtl','stRes'].forEach(function(id){ $('#'+id).hidden = S.tab !== 1; });
  syncSliders();
}

/* ---------- results ---------- */
function card(label,val,em,cls){ return '<div class="card'+(cls ? ' '+cls : '')+'"><small>'+label+'</small><strong>'+val+'</strong>'+(em ? '<em>'+em+'</em>' : '')+'</div>'; }
function msgList(el,list){ el.innerHTML = list.slice(0,6).map(function(m){ return '<li class="'+m[0]+'">'+m[1]+'</li>'; }).join(''); }
function chState(){
  return {shape:S.shape,b:S.b,z:S.shape === 'tri' ? Math.max(S.z,0.25) : S.z,D:S.D,S0:S.S0,n:S.n,d50:S.d50,bank:S.bank,mode:S.mode,y:S.y,Qset:S.Qs,mat:S.mat};
}
function altDepth(shape,p,Q,E,y,yc,ycap){
  var f = function(yy){ var G = geom(shape,p,yy); return yy + Q*Q/(2*g*G.A*G.A) - E; };
  if(y > yc){ if(f(yc*0.9999) > 0) return null; return bisect(f,1e-5,yc*0.9999); }
  return bisect(f,yc,Math.max(E,yc*1.01)*1.0);
}

function renderChannel(){
  var t = tx(), s = chState(), o = calcChannel(s), p = {b:s.b,z:s.z,D:s.D};
  var svgStr = chanSVG(o,s,t);
  var fr = o.full ? t.ccx.full : (o.Fr < 0.95 ? t.ccx.Fr[0] : (o.Fr < 1.05 ? t.ccx.Fr[1] : t.ccx.Fr[2]));
  var frCls = o.full ? '' : (o.Fr < 0.95 ? 'ok' : (o.Fr < 1.05 ? 'warn' : 'warn'));
  var move = o.tau0 > o.tauC;
  var h = card(t.cc[0],sig(o.Q)+' m³/s','') + card(t.cc[1],sig(o.V)+' m/s','')
    + card(t.cc[2],o.full ? '—' : o.Fr.toFixed(2),fr,frCls)
    + card(t.cc[3],sig(o.y)+' m','') + card(t.cc[4],o.yc === null ? '—' : sig(o.yc)+' m','')
    + card(t.cc[5],sig(o.E)+' m','') + card(t.cc[6],sig(o.A)+' m²','') + card(t.cc[7],sig(o.P)+' m','')
    + card(t.cc[8],sig(o.R)+' m','') + card(t.cc[9],o.T > 0 ? sig(o.T)+' m' : '—','')
    + card(t.cc[10],sig(o.tau0)+' Pa',t.tauSub(sig(o.tauC))+' · '+(move ? t.bed.move : t.bed.ok),move ? 'warn' : 'ok')
    + card(t.cc[11],sig(o.freeboard)+' m','',o.freeboard < 0 ? 'bad' : '');
  $('#chCards').innerHTML = h;
  var m = [];
  if(o.exceeds) m.push(['bad',t.msg.exceeds]); else if(o.full) m.push(['warn',t.msg.full]);
  if(o.over) m.push(['bad',t.msg.over]);
  if(!o.full){ m.push(o.Fr < 0.95 ? ['ok',t.msg.sub] : (o.Fr < 1.05 ? ['warn',t.msg.crit] : ['warn',t.msg.sup])); }
  if(o.Sc !== null) m.push(['',o.S0 < o.Sc ? t.msg.mild : t.msg.steep]);
  m.push(move ? ['warn',t.msg.erode] : ['ok',t.msg.stable]);
  if(s.shape === 'circ') m.push(['',t.msg.circ]);
  m.unshift(['',t.mats[S.mat]+': '+t.matMsg[S.mat]]);
  if(s.n >= 0.05) m.push(['',t.msg.nHi]);
  msgList($('#chMsgs'),m);
  // charts
  var ymaxC = s.shape === 'circ' ? s.D : s.bank, N = 90, i, ey = [], rt = [];
  for(i = 1; i <= N; i++){
    var yy = ymaxC*i/N, G = geom(s.shape,p,yy);
    if(G.A > 0) ey.push([yy + o.Q*o.Q/(2*g*G.A*G.A), yy]);
    rt.push([manningQ(s.shape,p,yy,s.n,o.S0), yy]);
  }
  var Emx = Math.max(o.E*2.6,(o.yc ? 1.5*o.yc*2.4 : 0), ymaxC*0.4);
  var eyc = ey.filter(function(q){ return q[0] <= Emx; });
  var marks = [{x:o.E,y:o.y,col:'#e0452f',t:'y'}];
  if(o.yc !== null){
    var alt = altDepth(s.shape,p,o.Q,o.E,o.y,o.yc); var Gc = geom(s.shape,p,o.yc);
    marks.push({x:o.yc + o.Q*o.Q/(2*g*Gc.A*Gc.A),y:o.yc,col:'#2f9e6d',hollow:true,t:'yc'});
    if(alt !== null && isFinite(alt)) marks.push({x:o.E,y:alt,col:'#e0452f',hollow:true});
  }
  $('#eyChart').innerHTML = chartSVG({xl:'E (m)',yl:'y (m)',curves:[{pts:eyc,col:'#2b7fc0',w:2.4},{pts:[[0,0],[Emx,Emx]],col:'#8899aa',dash:'4 3',w:1.2}],marks:marks,xmax:Emx,ymax:ymaxC});
  var rtm = [{x:o.Q,y:o.y,col:'#e0452f'}];
  $('#rtChart').innerHTML = chartSVG({xl:'Q (m³/s)',yl:'y (m)',curves:[{pts:rt,col:'#2b7fc0',w:2.4}],marks:rtm,ymax:ymaxC,hlines:s.shape === 'circ' ? [] : [{y:s.bank,c:'#b45309',t:t.bankL}]});
  $('#view').innerHTML = svgStr;
}

function renderStruct(){
  var t = tx(), s = {}, k; for(k in S) s[k] = S[k];
  s.front = t.front; s.twMan = S.tw;
  var r = calcStruct(s);
  var svgStr = sideSVG(r,s,t);
  var st = S.st, isGate = st === 'gate', cards = '', m = [];
  var jumpTxt = r.jump ? t.jumpState[r.jump.state] : '—';
  var jCls = r.jump ? (r.jump.state === 'swept' ? 'bad' : (r.jump.state === 'toe' ? 'ok' : 'warn')) : '';
  var state = isGate ? (r.ctrl === false ? t.states.gateFree : (r.submerged ? t.states.sub : t.states.free)) : (r.sub ? t.states.sub : t.states.free);
  var stCls = (isGate && (r.ctrl === false || r.submerged)) || r.sub ? 'warn' : 'ok';
  cards += card(t.sc.y1,sig(r.y1)+' m','yₙ = '+sig(r.yn)+' m');
  cards += isGate ? card(t.sc.y2,sig(r.yt)+' m','a = '+sig(S.a)+' m') : card(t.sc.H,sig(r.H)+' m','H/P = '+sig(r.H/S.P));
  cards += card(t.sc.afflux,(r.afflux >= 0 ? '+' : '')+sig(r.afflux)+' m','');
  cards += card(t.sc.state,state,'',stCls);
  if(r.jump){
    cards += card(t.sc.yt,sig(r.yt)+' m','Fr = '+r.jump.Fr.toFixed(1)+' · '+t.jumpType[r.jump.type]);
    cards += card(t.sc.jump,jumpTxt,'y₂ = '+sig(r.jump.y2)+' m · tw = '+sig(r.ytw)+' m',jCls);
    cards += card(t.sc.loss,r.ElossPct.toFixed(0)+' %',sig(r.Eloss)+' m',''); cards += card(t.sc.Lj,'≈ '+sig(r.jump.Lj)+' m','6 · y₂');
  } else { cards += card(t.sc.yt,'—','') + card(t.sc.jump,'—','') + card(t.sc.loss,'—','') + card(t.sc.Lj,'—',''); }
  cards += card(t.sc.bw,r.bw ? '≈ '+(r.bw.L >= 1000 ? (r.bw.L/1000).toFixed(1)+' km' : Math.round(r.bw.L)+' m') : '—','');
  cards += card(t.sc.fb,sig(r.freeboard)+' m','',r.freeboard < 0 ? 'bad' : '');
  if(st === 'check') cards += card(t.sc.spacing,'≈ '+sig(r.spacing)+' m','') + card(t.sc.wedge,'≈ '+sig(r.wedge)+' m³','');
  if(st === 'ogee') cards += card(t.sc.He,sig(r.HdRatio),'He = '+sig(r.He)+' m',r.HdRatio > 1 ? 'warn' : '');
  if(st === 'vnotch') cards += card(t.sc.notch,sig(r.notchTop)+' m','B = '+sig(S.B)+' m',r.notchTop > S.B ? 'bad' : '');
  $('#stCards').innerHTML = cards;
  if(isGate){
    if(r.ctrl === false) m.push(['warn',t.sm.gateFree]);
    if(r.warn.indexOf('gateOut') > -1) m.push(['warn',t.sm.gateOut]);
    if(r.submerged) m.push(['warn',t.sm.gateSub]);
  } else {
    if(r.sub) m.push(['warn',t.sm.subWeir]);
    r.warn.forEach(function(w){ if(t.sm[w]) m.push(['warn',t.sm[w]]); });
    if(st === 'ogee' && r.HdRatio > 1) m.push(['warn',t.sm.ogeeHi]);
  }
  if(r.over) m.push(['bad',t.sm.over]);
  if(r.steep) m.push(['warn',t.sm.steep]);
  if(r.jump && !(isGate && r.ctrl === false)) m.push([jCls,t.sm[r.jump.state]]);
  if(st === 'check') m.push(['',t.sm.check]);
  m.push(['',t.mats[S.mat]+': '+t.matMsg[S.mat]]);
  msgList($('#stMsgs'),m);
  // head-discharge chart
  var pts = [], i;
  for(i = 1; i <= 26; i++){ var q = S.Q*(0.1 + 1.9*i/26), s2 = {}; for(k in s) s2[k] = s[k]; s2.Q = q; s2.noBw = true; var rr = calcStruct(s2); pts.push([q,rr.y1]); }
  var hl = [{y:S.bank,c:'#b45309',t:t.bankL}];
  if(isGate) hl.push({y:S.a,c:'#2f9e6d',t:t.lip}); else hl.push({y:S.P,c:'#2f9e6d',t:t.crest});
  $('#hqChart').innerHTML = chartSVG({xl:t.xl,yl:t.yl,curves:[{pts:pts,col:'#2b7fc0',w:2.4}],marks:[{x:S.Q,y:r.y1,col:'#e0452f'}],hlines:hl});
  $('#view').innerHTML = svgStr;
  window.__lastStruct = r;
}
function refresh(){
  if(S.tab === 0) renderChannel(); else renderStruct();
  $('#view').setAttribute('aria-label',tx().alt);
}
function fullRender(){ buildAll(); refresh(); }

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var el = e.target; if(!el.dataset || !el.dataset.k) return;
  var k = el.dataset.k; S[k] = readSl(k,el);
  if(k === 'B' && S.L > S.B) S.L = S.B;
  if(k === 'n') followN();
  syncSliders(); refresh();
});
$('#shapes').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.shape = b.dataset.shape;
  if(S.shape === 'tri' && S.z < 0.25) S.z = 1;
  if(S.shape === 'circ' && S.y > S.D) S.y = S.D*0.5;
  fullRender();
});
function matClick(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.mat === 'est'){ S.n = clamp(Number((Math.pow(S.d50/1000,1/6)/21.1).toFixed(3)),0.01,0.1); S.mat = matOf(S.n); syncSliders(); matChips(); refresh(); }
  else setMat(b.dataset.mat);
}
$('#nPre').addEventListener('click',matClick); $('#stMat').addEventListener('click',matClick);
$('#modes').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.mode = b.dataset.mode; fullRender();
});
$('#stTypes').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.st = b.dataset.st;
  var d = TYPE_DEF[S.st], k; for(k in d) S[k] = d[k];
  if(S.st === 'sharp') S.L = S.B;
  fullRender();
});
$('#tcMode').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.twAuto = b.dataset.tc === 'auto';
  if(!S.twAuto){ var yn = rectNormal(S.Q,S.B,S.n,S.S0/1000); S.tw = clamp(Number(yn.toPrecision(2)),0.05,15); }
  fullRender();
});
$('#tabs').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.tab = +b.dataset.tab; fullRender();
});
$('#lang').addEventListener('click',function(){
  lang = lang === 'en' ? 'zh' : 'en';
  try{ localStorage.setItem('hyd-lang',lang); }catch(e){}
  fullRender();
});
window.__hyd = {geom:geom,manningQ:manningQ,normalDepth:normalDepth,criticalDepth:criticalDepth,calcChannel:calcChannel,calcStruct:calcStruct,rectNormal:rectNormal,conjugate:conjugate,specE:specE,S:S};
fullRender();

})();
</script>
