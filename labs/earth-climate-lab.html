<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<title>Earth climate lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8f1f7; --ink:#0a2540; --muted:#48627a; --line:#c2d4e2;
  --chip:#ffffff; --panel:#ffffff; --accent:#0b5c9e; --accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
    --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
  }
}
:root[data-theme="dark"]{
  --bg:#050f1c; --ink:#e6f2fb; --muted:#93aec4; --line:#1c3550;
  --chip:#0b1c2f; --panel:#0a1a2b; --accent:#8fd6f7; --accent-ink:#04141f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Bricolage Grotesque','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.45;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{
  max-width:1160px;margin:0 auto;padding:16px 14px 30px;
  display:flex;flex-direction:column;gap:12px;
}
.left,.right{display:contents}
.top{order:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tabs{order:1}
.gbox{order:2}
#layers{order:3}
#jumps{order:4}
.ctl{order:5}
.info{order:6}
.credit{order:7}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:56ch}
.lang{
  flex:none;min-height:40px;min-width:56px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:14px
}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--chip)}
.tabs button{min-height:42px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14.5px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* globe */
.gbox{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;
  width:min(100%,50vh);min-width:280px;max-width:100%;margin:0 auto;
  border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#0b1f3c 0%,#040b18 62%,#02060d 100%);
  border:1px solid rgba(143,214,247,.2);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
.gcv{touch-action:none}
.gcv{position:relative}
.gcv canvas{display:block;width:100%;height:auto;aspect-ratio:1/1}
.gctl{padding:2px 14px 10px;color:#dbe9f6}
.gl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}
.gl output{font-variant-numeric:tabular-nums;color:#8fd6f7}
.gctl input[type=range]{accent-color:#8fd6f7;height:28px;margin:0}
.gt{display:flex;justify-content:space-between;font-size:11.5px;color:#93aec4}
#fx{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#fx:active{cursor:grabbing}
.spin{
  position:absolute;top:10px;right:10px;min-height:34px;padding:0 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.25);background:rgba(4,12,26,.6);color:#e6f2fb;font-weight:600;font-size:13px;
  backdrop-filter:blur(6px)
}
.spin[aria-pressed="true"]{background:rgba(143,214,247,.9);color:#04141f;border-color:transparent}
.legend{position:absolute;left:12px;right:12px;bottom:10px;color:#dbe9f6;font-size:11.5px;transition:opacity .25s}
.lbar{height:8px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.llab{display:flex;justify-content:space-between;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.8)}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{
  min-height:38px;padding:0 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);font-weight:600;font-size:13.5px
}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.jumps button{min-height:32px;padding:0 9px;font-size:12.5px;font-weight:500;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.panel h2{margin:0 0 6px;font-size:20px;line-height:1.25}
.panel h3{margin:16px 0 6px;font-size:15px}
.big{font-size:22px;font-weight:700;line-height:1.25;margin:0}
.muted{color:var(--muted)}
.desc{margin:6px 0 0;font-size:15px;max-width:60ch}
.fine{margin:12px 0 0;color:var(--muted);font-size:12.5px}
.credit{margin:0;text-align:center;color:var(--muted);font-size:12px}

.row{margin:0 0 6px}
.row label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14.5px}
.row output{font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{display:block;width:100%;height:32px;margin:2px 0 0;accent-color:var(--accent);background:transparent}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.presets button{
  min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);font-weight:600;font-size:13px
}
.presets button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.presets i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--chip)}
.card small{display:block;color:var(--muted);font-size:12.5px}
.card strong{display:block;font-size:19px;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
.card em{display:block;font-style:normal;color:var(--muted);font-size:11.5px}

.walker{display:block;width:100%;height:auto;margin:6px 0 2px;color:var(--muted)}
.walker text{font-family:inherit;fill:#b9cde0;font-size:10.5px}
.walker .lbl{fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2.5px}

.impacts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.impacts button{
  width:100%;display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;text-align:left;
  padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);min-height:44px
}
.impacts i{width:12px;height:12px;border-radius:50%;margin-top:5px}
.impacts b{display:block;font-size:14.5px}
.impacts span{display:block;color:var(--muted);font-size:13.5px}

.scen{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.scen button{
  min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);font-weight:600;font-size:13px
}
.scen button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.scen i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.chart{display:block;width:100%;height:auto;color:var(--muted)}
.chart text{font-family:inherit;font-size:10px;fill:currentColor}

@media (min-width:900px){
  .app{
    padding:28px 24px 40px;gap:14px 28px;
    display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.9fr);align-items:start;
  }
  .top{grid-column:1 / -1}
  .left{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
  .right{display:flex;flex-direction:column;gap:12px}
  .gbox{position:relative;top:auto;width:100%;max-width:640px;min-width:0}
  .credit{order:9}
  h1{font-size:34px}
}
@media (max-height:560px){ .gbox{position:relative;top:auto} }
@media (prefers-reduced-motion:reduce){ .legend{transition:none} }

.notes{margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
.notes summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center}
.notes p{margin:8px 0 0;font-size:13.5px;color:var(--muted);max-width:62ch}
.notes b{color:var(--ink)}

</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="lang" id="lang" type="button" aria-label="Switch language">中文</button>
  </header>

  <div class="left">
    <div class="gbox" id="gbox">
      <div class="gcv">
        <canvas id="globe" role="img"></canvas>
        <canvas id="fx"></canvas>
        <button class="spin" id="spin" type="button" aria-pressed="false"></button>
        <div class="legend" id="legend"><div class="lbar" id="lbar"></div><div class="llab"><span id="l0"></span><span id="l1"></span><span id="l2"></span></div></div>
      </div>
      <div class="gctl">
        <label for="gRange" class="gl"><span id="gLabel"></span><output id="gOut"></output></label>
        <input id="gRange" type="range" min="-25" max="25" step="1" value="0">
        <div class="gt"><span id="gT0"></span><span id="gT1"></span><span id="gT2"></span></div>
      </div>
    </div>
    <div class="chips" id="layers" role="group"></div>
    <div class="chips jumps" id="jumps" role="group"></div>
  </div>

  <div class="right">
    <nav class="tabs" id="tabs"></nav>

    <section class="panel ctl" id="ctlEnso">
      <div class="presets" id="enPresets"></div>
    </section>

    <section class="panel ctl" id="ctlClim" hidden>
      <div class="scen" id="scen"></div>
    </section>

    <section class="panel info" id="pEnso">
      <p class="big" id="enPhase"></p>
      <p class="desc" id="enDesc"></p>
      <h3 id="wkHead"></h3>
      <svg class="walker" id="walker" viewBox="0 0 360 178" role="img">
        <defs>
          <linearGradient id="wOc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a97d8"/><stop offset="1" stop-color="#0a3563"/></linearGradient>
          <linearGradient id="wWm" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="132"><stop offset="0" stop-color="#ff7a45" stop-opacity=".98"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></linearGradient>
          <marker id="wAh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#9fb8cc"/></marker>
          <marker id="wAhW" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#7ec6ff"/></marker>
        </defs>
        <rect x="0" y="0" width="360" height="178" rx="10" fill="#0a1a30" opacity=".92"/>
        <path d="M22 96 H338 V166 H22 Z" fill="url(#wOc)"/>
        <clipPath id="wClip"><rect x="22" y="96" width="316" height="70"/></clipPath>
        <g clip-path="url(#wClip)"><ellipse id="wWarm" cx="110" cy="102" rx="82" ry="24" fill="url(#wWm)"/>
        <ellipse id="wCold" cx="300" cy="103" rx="34" ry="9" fill="#66d9ff" opacity=".8"/></g>
        <path id="wTherm" d="M22 125 Q180 111 338 97" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 4" opacity=".85"/>
        <path d="M0 96 V78 Q10 70 22 78 V96 Z" fill="#6b7f52"/>
        <path d="M338 96 V72 L346 58 L352 66 L360 52 V96 Z" fill="#7b6a58"/>
        <g id="wCloud">
          <g fill="#e9f1fa"><circle cx="0" cy="0" r="9"/><circle cx="12" cy="-4" r="11"/><circle cx="25" cy="0" r="9"/><ellipse cx="12" cy="4" rx="26" ry="6"/></g>
          <g id="wRain" stroke="#8fd0ff" stroke-width="1.6" stroke-linecap="round"><line x1="0" y1="14" x2="-2" y2="24"/><line x1="12" y1="14" x2="10" y2="24"/><line x1="24" y1="14" x2="22" y2="24"/></g>
        </g>
        <line id="wTop" x1="120" y1="30" x2="190" y2="30" stroke="#9fb8cc" stroke-width="2.2" marker-end="url(#wAh)"/>
        <line id="wSink" x1="308" y1="38" x2="308" y2="70" stroke="#9fb8cc" stroke-width="2.2" marker-end="url(#wAh)"/>
        <line id="wRise" x1="112" y1="72" x2="112" y2="46" stroke="#9fb8cc" stroke-width="2.2" marker-end="url(#wAh)"/>
        <line id="wTrade" x1="300" y1="80" x2="230" y2="80" stroke="#7ec6ff" stroke-width="3" marker-end="url(#wAhW)"/>
        <text id="tWest" x="26" y="90">W</text>
        <text id="tEast" x="304" y="90" text-anchor="end">E</text>
        <text id="tWarm" class="lbl" x="110" y="112" text-anchor="middle"></text>
        <text id="tCold" class="lbl" x="300" y="122" text-anchor="middle"></text>
        <text id="tTherm" class="lbl" x="180" y="150" text-anchor="middle"></text>
        <text id="tTrade" x="265" y="72" text-anchor="middle"></text>
        <text id="tRain" x="150" y="52"></text>
        <text id="tL" x="22" y="174"></text>
        <text id="tR" x="338" y="174" text-anchor="end"></text>
      </svg>
      <h3 id="imHead"></h3>
      <p class="muted" id="imHint" style="margin:0 0 8px;font-size:13px"></p>
      <ul class="impacts" id="impacts"></ul>
      <p class="fine" id="enGlobal"></p>
      <p class="fine" id="enFine"></p>
      <details class="notes"><summary id="enNSum"></summary><div id="enNBody"></div></details>
    </section>

    <section class="panel info" id="pClim" hidden>
      <p class="big" id="clHead"></p>
      <div class="cards" id="clCards"></div>
      <p class="desc" id="clSplit"></p>
      <h3 id="chHead"></h3>
      <svg class="chart" id="chart" viewBox="0 0 320 140" role="img"></svg>
      <h3 id="fcHead"></h3>
      <p class="desc" id="clFact" style="margin-top:0"></p>
      <p class="fine" id="clFine"></p>
      <details class="notes"><summary id="clNSum"></summary><div id="clNBody"></div></details>
    </section>

    <p class="credit" id="credit"></p>
  </div>

  var dt = performance.now() - t0;
  perf = perf*0.85 + dt*0.15;
  if(perf > 42 && GL.N > 340 && !adapting){ adapting = true; setTimeout(function(){ setup(Math.round(GL.N*0.82)); adapting = false; perf = 20; },0); }
}
var perf = 20, adapting = false;

/* ---------- projection + fx (wind, focus ring) ---------- */
var proj = {x:0,y:0,v:0};
function project(lonD,latD,bs){
  var lam = lonD*D2R, phi = latD*D2R, cp = Math.cos(phi);
  var px = cp*Math.sin(lam), py = Math.sin(phi), pz = cp*Math.cos(lam);
  var xv = px*bs.rx + pz*bs.rz, yv = px*bs.ux + py*bs.uy + pz*bs.uz, zv = px*bs.fx + py*bs.fy + pz*bs.fz;
  proj.x = GL.N/2 + xv*GL.R; proj.y = GL.N/2 - yv*GL.R; proj.v = zv;
}
var parts = [], focus = null;
function spawn(p, bs){
  for(var t=0;t<12;t++){
    var x = Math.random()*2-1, y = Math.random()*2-1, rr = x*x+y*y;
    if(rr > 0.94) continue;
    var z = Math.sqrt(1-rr);
    var wx = x*bs.rx + y*bs.ux + z*bs.fx, wy = y*bs.uy + z*bs.fy, wz = x*bs.rz + y*bs.uz + z*bs.fz;
    p.lat = Math.asin(clamp(wy,-1,1))/D2R; p.lon = Math.atan2(wx,wz)/D2R; break;
  }
  p.age = 0; p.life = 50 + Math.random()*90;
}
function drawFx(dtf){
  var N = GL.N; if(!N) return;
  fctx.clearRect(0,0,N,N);
  var bs = basis();
  if(cfg.wind){
    var want = N > 420 ? 1000 : 650;
    while(parts.length < want){ var np = {lon:0,lat:0,age:0,life:1}; spawn(np,bs); np.age = Math.random()*np.life; parts.push(np); }
    if(parts.length > want) parts.length = want;
    var buckets = [[],[],[],[],[],[]];
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      var uv = windUV(p.lon,p.lat,cfg.n), cf = Math.max(0.2,Math.cos(p.lat*D2R));
      var dlon = uv[0]*0.06*dtf/cf, dlat = uv[1]*0.06*dtf;
      p.lon += dlon; p.lat += dlat; p.age += dtf;
      if(p.lon > 180) p.lon -= 360; else if(p.lon < -180) p.lon += 360;
      if(p.age > p.life || p.lat > 85 || p.lat < -85){ spawn(p,bs); continue; }
      project(p.lon,p.lat,bs); var x1 = proj.x, y1 = proj.y, v1 = proj.v;
      if(v1 < 0.1) continue;
      project(p.lon-dlon*5/dtf,p.lat-dlat*5/dtf,bs);
      var f = Math.sin(Math.PI*p.age/p.life)*clamp(v1*1.4,0,1);
      var ab = f > 0.66 ? 2 : (f > 0.33 ? 1 : 0);
      var warm = (Math.abs(p.lat) < 20 && uv[0] > 0) ? 3 : 0;
      buckets[warm+ab].push(proj.x,proj.y,x1,y1);
    }
    var cols = ['rgba(255,255,255,0.16)','rgba(255,255,255,0.34)','rgba(255,255,255,0.6)','rgba(255,196,90,0.3)','rgba(255,196,90,0.6)','rgba(255,208,120,0.9)'];
    fctx.lineWidth = Math.max(1,N/520); fctx.lineCap = 'round';
    for(var bi=0;bi<6;bi++){
      var arr = buckets[bi]; if(!arr.length) continue;
      fctx.beginPath();
      for(var q=0;q<arr.length;q+=4){ fctx.moveTo(arr[q],arr[q+1]); fctx.lineTo(arr[q+2],arr[q+3]); }
      fctx.strokeStyle = cols[bi]; fctx.stroke();
    }
  }
  if(focus){
    var age = (performance.now()-focus.t0)/1000;
    if(age > 4){ focus = null; }
    else if(age >= 0){
      project(focus.lon,focus.lat,bs);
      if(proj.v > 0.02){
        var pr = (age%1.2)/1.2, rad = N*0.02 + pr*N*0.045, al = (1-pr)*(1-age/4);
        fctx.strokeStyle = 'rgba(255,255,255,'+(0.9*al).toFixed(3)+')'; fctx.lineWidth = Math.max(2,N/200);
        fctx.beginPath(); fctx.arc(proj.x,proj.y,rad,0,6.2832); fctx.stroke();
        fctx.fillStyle = 'rgba(255,255,255,0.95)'; fctx.beginPath(); fctx.arc(proj.x,proj.y,Math.max(2.5,N/170),0,6.2832); fctx.fill();
      }
    }
  }
}

/* ---------- interaction ---------- */
var autoSpin = false, fly = null, vel = {x:0,y:0}, drag = null;
function flyTo(lon,lat,ring){
  var dl = wrapd(lon-lon0);
  fly = {t0:performance.now(), d:900, l0:lon0, dl:dl, a0:lat0, da:clamp(lat,-75,75)-lat0};
  autoSpin = false; vel.x = vel.y = 0; updSpin();
  if(ring) focus = {lon:lon,lat:lat,t0:performance.now()+900};
}
fx.addEventListener('pointerdown',function(e){
  fx.setPointerCapture(e.pointerId);
  drag = {x:e.clientX,y:e.clientY,t:performance.now()}; fly = null; vel.x = vel.y = 0;
  if(autoSpin){ autoSpin = false; updSpin(); }
});
fx.addEventListener('pointermove',function(e){
  if(!drag) return;
  var css = fx.clientWidth*0.44, k = 57.3/css;
  var dx = e.clientX-drag.x, dy = e.clientY-drag.y, now = performance.now(), dt = Math.max(8,now-drag.t);
  lon0 = wrapd(lon0 - dx*k); lat0 = clamp(lat0 + dy*k,-80,80);
  vel.x = (-dx*k)/dt*16; vel.y = (dy*k)/dt*16;
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now; dirty = true;
});
function endDrag(){ drag = null; }
fx.addEventListener('pointerup',endDrag); fx.addEventListener('pointercancel',endDrag);

var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = Math.min(0.1,(ts-last)/1000 || 0.016); last = ts;
  var dtf = dt*60, changed = dirty;
  if(fly){
    var p = clamp((performance.now()-fly.t0)/fly.d,0,1), e = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    lon0 = wrapd(fly.l0 + fly.dl*e); lat0 = fly.a0 + fly.da*e; changed = true;
    if(p >= 1) fly = null;
  } else if(!drag && (Math.abs(vel.x) > 0.01 || Math.abs(vel.y) > 0.01)){
    lon0 = wrapd(lon0 + vel.x*dtf); lat0 = clamp(lat0 + vel.y*dtf,-80,80);
    vel.x *= Math.pow(0.94,dtf); vel.y *= Math.pow(0.94,dtf); changed = true;
  }
  if(autoSpin && !drag){ lon0 = wrapd(lon0 + 7*dt); changed = true; }
  if(changed){ drawGlobe(); dirty = false; }
  if(cfg.wind || focus || changed) drawFx(dtf);
}

/* ================= UI ================= */
var S = {tab:0, n:0, ovE:'sst', ovC:'warm', wind:true, clouds:true, ice:true, sc:1, year:2050};
var PRESETN = [-1.6, 0, 2.0, 2.4];
var PRESETC = ['#4aa3ff','#9aa7b4','#ff9a4a','#ee4a3a'];
var IMP = [{lon:115,lat:-4,s:-1},{lon:-80,lat:-6,s:1},{lon:-100,lat:31,s:1},{lon:-56,lat:-30,s:1},
           {lon:-60,lat:-2,s:-1},{lon:38,lat:1,s:1},{lon:25,lat:-19,s:-1},{lon:78,lat:21,s:-1}];
var JUMP = {pacific:[-150,0],americas:[-75,8],africa:[20,5],asia:[118,-2],arctic:[-45,76]};

function updSpin(){ var b = $('#spin'); b.textContent = tx().spin; b.setAttribute('aria-pressed', String(autoSpin)); }
function updCfg(){
  cfg.ov = S.tab === 0 ? S.ovE : S.ovC;
  cfg.n = S.n;
  cfg.dT = S.tab === 0 ? 1.2 : dTat(S.sc,S.year);
  cfg.clouds = S.clouds;
  cfg.ice = S.tab === 0 ? true : S.ice;
  cfg.wind = S.tab === 0 && S.wind;
  dirty = true;
  // legend
  var lg = $('#legend'), t = tx();
  if(cfg.ov === 'none'){ lg.style.opacity = 0; }
  else {
    lg.style.opacity = 1;
    $('#lbar').style.background = lutCSS(LUT[cfg.ov]);
    var L = t.leg[cfg.ov]; $('#l0').textContent = L[0]; $('#l1').textContent = L[1]; $('#l2').textContent = L[2];
  }
}
function phaseOf(n){
  var a = Math.abs(n); if(a < 0.5) return {k:'neu',i:0};
  return {k:n > 0 ? 'el' : 'la', i:a < 1 ? 0 : (a < 1.5 ? 1 : (a < 2 ? 2 : 3))};
}
function phName(ph){ var t = tx(); return ph.k === 'neu' ? t.phNeu : (ph.k === 'el' ? t.phEl[ph.i] : t.phLa[ph.i]); }
function syncRange(){
  var t = tx(), r = $('#gRange');
  if(S.tab === 0){
    r.min = -25; r.max = 25; r.step = 1; r.value = Math.round(S.n*10);
    $('#gLabel').textContent = t.enLabel;
    $('#gOut').textContent = fmt1(S.n)+' °C · '+phName(phaseOf(S.n));
    $('#gT0').textContent = t.tk[0]; $('#gT1').textContent = t.tk[1]; $('#gT2').textContent = t.tk[2];
    r.setAttribute('aria-valuetext', fmt1(S.n)+' °C');
  } else {
    r.min = 2000; r.max = 2100; r.step = 1; r.value = S.year;
    $('#gLabel').textContent = t.yr; $('#gOut').textContent = S.year;
    $('#gT0').textContent = '2000'; $('#gT1').textContent = '2050'; $('#gT2').textContent = '2100';
    r.setAttribute('aria-valuetext', String(S.year));
  }
}
function fmt1(v){ return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1); }

function buildChips(){
  var t = tx(), items = S.tab === 0 ? [['sst','ov'],['rain','ov'],['wind','tog'],['clouds','tog']] : [['warm','ov'],['ice','tog'],['clouds','tog']];
  var h = '';
  items.forEach(function(it){
    var on = it[1] === 'ov' ? ((S.tab === 0 ? S.ovE : S.ovC) === it[0]) : S[it[0]];
    h += '<button type="button" data-l="'+it[0]+'" data-t="'+it[1]+'" aria-pressed="'+!!on+'">'+t.lay[it[0]]+'</button>';
  });
  $('#layers').innerHTML = h;
}
function buildJumps(){
  var t = tx(), h = '';
  Object.keys(JUMP).forEach(function(k){ h += '<button type="button" data-j="'+k+'">'+t.jm[k]+'</button>'; });
  $('#jumps').innerHTML = h;
}

/* ---- ENSO ---- */
function updWalker(){
  var n = S.n, t = tx(), s = clamp(1-0.4*n,0.12,1.6), tl = clamp(1-0.45*n,0.1,1.9);
  var yL = 112+13*tl, yR = Math.max(94,110-13*tl);
  $('#wTherm').setAttribute('d','M22 '+yL.toFixed(1)+' Q180 '+((yL+yR)/2-6).toFixed(1)+' 338 '+yR.toFixed(1));
  var wc = clamp(105+n*38,45,215);
  var warm = $('#wWarm'); warm.setAttribute('cx',wc.toFixed(1));
  var co = clamp(0.85-0.35*n,0.1,1); var cold = $('#wCold'); cold.setAttribute('opacity',co.toFixed(2)); cold.setAttribute('ry',(4+5*co).toFixed(1));
  $('#wCloud').setAttribute('transform','translate('+(wc-12).toFixed(1)+' 42)');
  var top = $('#wTop'); top.setAttribute('x1',wc.toFixed(1)); top.setAttribute('x2',(wc+22+58*s).toFixed(1)); top.setAttribute('opacity',clamp(s,0.25,1));
  var sinkX = clamp(wc+118,250,318), sk = $('#wSink'); sk.setAttribute('x1',sinkX); sk.setAttribute('x2',sinkX); sk.setAttribute('opacity',clamp(s,0.25,1));
  var rise = $('#wRise'); rise.setAttribute('x1',wc.toFixed(1)); rise.setAttribute('x2',wc.toFixed(1)); rise.setAttribute('opacity',clamp(s,0.25,1));
  var tr = $('#wTrade'), len = 30+66*s; tr.setAttribute('x2',(330-len).toFixed(1)); tr.setAttribute('opacity',clamp(s+0.15,0.3,1));
  $('#tTrade').setAttribute('x',(330-len/2).toFixed(1));
  $('#tWarm').setAttribute('x',wc.toFixed(1));
  $('#tRain').setAttribute('x',(wc+36).toFixed(1));
  $('#tWarm').textContent = t.wWarm; $('#tCold').textContent = t.wCold; $('#tTherm').textContent = t.wTherm;
  $('#tTrade').textContent = t.wTrade; $('#tRain').textContent = t.wRain;
  $('#tL').textContent = t.wL; $('#tR').textContent = t.wR; $('#tWest').textContent = t.wW; $('#tEast').textContent = t.wE;
  $('#walker').setAttribute('aria-label', t.wk);
}
function renderEnso(){
  var t = tx(), n = S.n, ph = phaseOf(n);
  syncRange();
  $('#enPhase').textContent = ph.k === 'neu' ? t.phNeu : (ph.k === 'el' ? t.phEl[ph.i] : t.phLa[ph.i]);
  $('#enDesc').textContent = ph.k === 'neu' ? t.dNeu : (ph.k === 'el' ? t.dEl : t.dLa);
  $('#enPresets').querySelectorAll('button').forEach(function(b,i){ b.setAttribute('aria-pressed', String(Math.abs(PRESETN[i]-n) < 0.05)); });
  updWalker();
  var h = '';
  IMP.forEach(function(im,i){
    var d = t.imp[i], col, sub;
    if(ph.k === 'neu'){ col = 'linear-gradient(135deg,#e8873a 50%,#3ed08f 50%)'; sub = t.both(d.el,d.la); }
    else { var wet = n*im.s > 0; col = wet ? '#3ed08f' : '#e8873a'; sub = n > 0 ? d.el : d.la; }
    h += '<li><button type="button" data-i="'+i+'"><i style="background:'+col+'"></i><span><b>'+d.n+'</b><span>'+sub+' · '+d.z+'</span></span></button></li>';
  });
  $('#impacts').innerHTML = h;
  cfg.n = n; dirty = true;
}

/* ---- climate ---- */
function chartSVG(dT0){
  var W = 320, H = 140, l = 26, r = 10, tp = 8, bt = 20;
  function X(y){ return l + (y-2000)/100*(W-l-r); }
  function Y(v){ return H-bt - v/5*(H-bt-tp); }
  var s = '', v, y, i;
  for(v=0; v<=5; v++) s += '<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="currentColor" stroke-opacity="'+(v === 0 ? 0.5 : 0.16)+'"/><text x="'+(l-5)+'" y="'+(Y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  s += '<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(1.5)+'" y2="'+Y(1.5)+'" stroke="#e8873a" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(W-r-2)+'" y="'+(Y(1.5)-3)+'" text-anchor="end" style="fill:#e8873a">1.5</text>';
  [2000,2050,2100].forEach(function(yy,k){ s += '<text x="'+X(yy)+'" y="'+(H-5)+'" text-anchor="'+(k === 0 ? 'start' : (k === 2 ? 'end' : 'middle'))+'">'+yy+'</text>'; });
  SC.forEach(function(sc,k){
    var pts = [];
    for(y=2000;y<=2100;y+=5) pts.push(X(y).toFixed(1)+','+Y(dTat(k,y)).toFixed(1));
    var sel = k === S.sc;
    s += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+sc.col+'" stroke-width="'+(sel ? 2.8 : 1.4)+'" stroke-opacity="'+(sel ? 1 : 0.55)+'" stroke-linejoin="round"/>';
  });
  s += '<line x1="'+X(S.year)+'" x2="'+X(S.year)+'" y1="'+tp+'" y2="'+(H-bt)+'" stroke="currentColor" stroke-opacity=".35"/>';
  s += '<circle cx="'+X(S.year)+'" cy="'+Y(dT0)+'" r="5" fill="'+SC[S.sc].col+'" stroke="#fff" stroke-width="1.6"/>';
  return s;
}
function renderClim(){
  var t = tx(), dT = dTat(S.sc,S.year), slr = slrAt(S.sc,S.year)*100, A = iceArea(dT), hx = heatX(dT);
  syncRange();
  $('#scen').querySelectorAll('button').forEach(function(b,i){ b.setAttribute('aria-pressed', String(i === S.sc)); });
  $('#clHead').textContent = t.clHead(t.scen[S.sc],S.year);
  var vals = ['+'+dT.toFixed(1)+' °C', (slr >= 0 ? '+' : '−')+Math.abs(Math.round(slr))+' cm', A < 1 ? '<1' : A.toFixed(1), hx.toFixed(1)+'×'];
  $('#clCards').innerHTML = t.cd.map(function(c,i){ return '<div class="card"><small>'+c[0]+'</small><strong>'+vals[i]+'</strong><em>'+c[1]+(i === 2 && A < 1 ? ' · '+t.iceFree : '')+'</em></div>'; }).join('');
  $('#clSplit').textContent = t.split((warmStats.land*dT).toFixed(1),(warmStats.ocean*dT).toFixed(1),(warmStats.arctic*dT).toFixed(1));
  $('#chart').innerHTML = chartSVG(dT);
  $('#chart').setAttribute('aria-label', t.chHead);
  var fi = dT < 1.3 ? 0 : (dT < 1.9 ? 1 : (dT < 2.6 ? 2 : (dT < 3.4 ? 3 : 4)));
  $('#clFact').textContent = t.facts[fi];
  cfg.dT = dT; dirty = true;
}

function renderStatic(){
  var t = tx();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t.h1;
  $('#h1').textContent = t.h1; $('#sub').textContent = t.sub[S.tab];
  $('#lang').textContent = lang === 'en' ? '中文' : 'EN';
  $('#tabs').innerHTML = t.tabs.map(function(x,i){ return '<button type="button" data-tab="'+i+'" aria-pressed="'+(i === S.tab)+'">'+x+'</button>'; }).join('');
  $('#ctlEnso').hidden = $('#pEnso').hidden = S.tab !== 0;
  $('#ctlClim').hidden = $('#pClim').hidden = S.tab !== 1;
  $('#enPresets').innerHTML = t.pre.map(function(x,i){ return '<button type="button" data-p="'+i+'"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:'+PRESETC[i]+'"></i>'+x+'</button>'; }).join('');
  $('#wkHead').textContent = t.wk; $('#imHead').textContent = t.imHead; $('#imHint').textContent = t.imHint;
  $('#enGlobal').textContent = t.glob; $('#enFine').textContent = t.enFine;
  $('#scen').innerHTML = t.scen.map(function(x,i){ return '<button type="button" data-s="'+i+'"><i style="background:'+SC[i].col+'"></i>'+x+'</button>'; }).join('');
  $('#chHead').textContent = t.chHead; $('#fcHead').textContent = t.fcHead; $('#clFine').textContent = t.clFine;
  $('#credit').textContent = t.credit; $('#globe').setAttribute('aria-label', t.alt);
  $('#enNSum').textContent = $('#clNSum').textContent = t.nSum;
  $('#enNBody').innerHTML = t.nEnso.map(function(x){ return '<p>'+x+'</p>'; }).join('');
  $('#clNBody').innerHTML = t.nClim.map(function(x){ return '<p>'+x+'</p>'; }).join('');
  buildChips(); buildJumps(); updSpin();
  renderEnso(); renderClim(); updCfg();
}

/* events */
$('#lang').addEventListener('click',function(){
  lang = lang === 'en' ? 'zh' : 'en';
  try{ localStorage.setItem('ecl-lang',lang); }catch(e){}
  renderStatic();
});
$('#tabs').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return;
  S.tab = +b.dataset.tab; renderStatic();
  if(S.tab === 0) flyTo(-150,8); else flyTo(-40,62);
});
$('#layers').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return;
  var id = b.dataset.l;
  if(b.dataset.t === 'ov'){
    if(S.tab === 0) S.ovE = S.ovE === id ? 'none' : id; else S.ovC = S.ovC === id ? 'none' : id;
  } else S[id] = !S[id];
  buildChips(); updCfg();
});
$('#jumps').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return;
  var j = JUMP[b.dataset.j]; flyTo(j[0],j[1]);
});
$('#spin').addEventListener('click',function(){ autoSpin = !autoSpin; fly = null; vel.x = vel.y = 0; updSpin(); });
$('#gRange').addEventListener('input',function(e){
  if(S.tab === 0){ S.n = +e.target.value/10; renderEnso(); }
  else { S.year = +e.target.value; renderClim(); updCfg(); }
});
$('#enPresets').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.n = PRESETN[+b.dataset.p]; renderEnso();
});
$('#impacts').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return;
  var im = IMP[+b.dataset.i]; flyTo(im.lon,im.lat,true);
});
$('#scen').addEventListener('click',function(e){
  var b = e.target.closest('button'); if(!b) return; S.sc = +b.dataset.s; renderClim(); updCfg();
});
window.addEventListener('resize',function(){ resize(); });

window.__lab = {dTat:dTat,slrAt:slrAt,iceArea:iceArea,heatX:heatX,sstPat:sstPat,SST_NORM:SST_NORM,phaseOf:phaseOf,warmStats:function(){return warmStats;},sstU:sstU};
/* boot */
var B = window.__EARTH_ASSETS;
Promise.all([decode(B.base),decode(B.mask),decode(B.clouds),decode(B.lights)]).then(function(ims){
  tex.base = new Uint32Array(grab(ims[0],2048,1024).buffer);
  tex.mask = gray(grab(ims[1],1024,512),1024*512);
  tex.clouds = gray(grab(ims[2],1024,512),1024*512);
  tex.lights = gray(grab(ims[3],1024,512),1024*512);
  buildFields();
  resize(); renderStatic(); dirty = true;
  requestAnimationFrame(frame);
});
})();
